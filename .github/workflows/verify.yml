name: Verify source handover
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - name: Install isolated UI test browser
        run: npx playwright install --with-deps chromium
      - name: Verify partner administration and acceptance on desktop and mobile
        run: npm run test:ui

      - name: Verify public pages and selected actions on desktop and mobile
        run: node scripts/check-public-ui.mjs

      - name: Preserve approved and rendered desktop/mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-public-frontend-evidence
          path: artifacts/public-frontend/
          if-no-files-found: warn
